<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page 01 - Email PII</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>User Profile Settings</h2>
    <p>Welcome to your account settings. Update your email address below.</p>
    <div class="form-group">
      <label for="user-email">Email Address</label>
      <input type="email" id="user-email" name="user_email" value="alex.morris@sih2024.org" placeholder="enter your email">
    </div>
    <div class="form-group">
      <label for="backup-email">Recovery Email</label>
      <input type="text" id="backup-email" name="backup_email_hint" value="recovery.alex@gmail.com">
    </div>
    <p>Contact support at support@sih-privacy.in for assistance.</p>
    <button type="button" id="save-btn">Save Changes</button>
  </div>
</body>
</html>
