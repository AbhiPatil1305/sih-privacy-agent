<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page 04 - Credit Card PII</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Payment Portal</h2>
    <div class="form-group">
      <label for="card-num">Card Number</label>
      <input type="text" id="card-num" name="card_number" value="4532 1234 5678 9012">
    </div>
    <div class="form-group">
      <label for="card-exp">Expiry Date</label>
      <input type="text" id="card-exp" name="exp_date" value="12/28">
    </div>
    <p>Direct payment to card: 5412751234123456</p>
    <button type="button" id="pay-btn">Pay $49.99</button>
  </div>
</body>
</html>
