<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page 02 - Phone Number PII</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
    .container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contact Information</h2>
    <p>Please confirm your mobile number for SMS verification.</p>
    <div class="form-group">
      <label for="phone-input">Mobile Phone</label>
      <input type="tel" id="phone-input" name="phone_number" value="+91-9876543210">
    </div>
    <div class="form-group">
      <label for="work-phone">Work Phone</label>
      <input type="text" id="work-phone" name="work_phone" value="123-456-7890">
    </div>
    <p>Hotline number: +1 (800) 555-0199</p>
    <button type="button" id="verify-btn">Verify Phone</button>
  </div>
</body>
</html>
