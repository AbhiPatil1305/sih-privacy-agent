<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page 05 - SSN & Government IDs</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Identity Verification</h2>
    <p>Submit your social security or national identification details.</p>
    <div class="form-group">
      <label for="ssn-field">Social Security Number (SSN)</label>
      <input type="text" id="ssn-field" name="ssn_number" value="123-45-6789">
    </div>
    <p>Reference SSN: 987-65-4321</p>
    <button type="button" id="submit-id">Submit ID</button>
  </div>
</body>
</html>
