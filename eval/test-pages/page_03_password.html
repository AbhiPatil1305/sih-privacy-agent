<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page 03 - Password & Secret Tokens</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Secure Login</h2>
    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username_field" value="admin_user">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password_field" value="SuperSecretP@ss123">
      </div>
      <div class="form-group">
        <label for="secret-key">API Secret Key</label>
        <input type="text" id="secret-key" name="password_hint_key" value="sk_live_998877665544332211">
      </div>
      <input type="hidden" name="auth_token" value="hidden_token_xyz987">
      <button type="submit" id="login-btn">Login</button>
    </form>
  </div>
</body>
</html>
